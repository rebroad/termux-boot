apply plugin: 'com.android.application'

android {
    namespace "com.termux.boot"

    compileSdk project.properties.compileSdkVersion.toInteger()

    def appVersionName = System.getenv("TERMUX_BOOT_APP_BUILD__APP_VERSION_NAME") ?: ""
    def apkVersionTag = System.getenv("TERMUX_BOOT_APP_BUILD__APK_VERSION_TAG") ?: ""
    def gitCommit = System.getenv("TERMUX_GIT_COMMIT")
    if (!(gitCommit ==~ /[0-9a-fA-F]{10}/)) {
        def gitCommitProcess = new ProcessBuilder("git", "rev-parse", "HEAD").directory(rootDir).redirectErrorStream(true).start()
        def gitCommitOutput = gitCommitProcess.inputStream.getText("UTF-8").trim()
        gitCommit = gitCommitProcess.waitFor() == 0 && gitCommitOutput ==~ /[0-9a-fA-F]{40}/ ? gitCommitOutput.substring(0, 10) : "Unknown"
    }
    def rebroadSigningStoreFile = System.getenv("TERMUX_REBROAD_SIGNING_STORE_FILE")
    def rebroadSigningStorePassword = System.getenv("TERMUX_REBROAD_SIGNING_STORE_PASSWORD")
    def rebroadSigningKeyAlias = System.getenv("TERMUX_REBROAD_SIGNING_KEY_ALIAS")
    def rebroadSigningKeyPassword = System.getenv("TERMUX_REBROAD_SIGNING_KEY_PASSWORD")
    def rebroadSigningEnabled = rebroadSigningStoreFile && rebroadSigningStorePassword && rebroadSigningKeyAlias && rebroadSigningKeyPassword

    defaultConfig {
        applicationId "com.termux.boot"
        minSdk project.properties.minSdkVersion.toInteger()
        targetSdk project.properties.targetSdkVersion.toInteger()
        versionCode 1000
        versionName "0.8.1"

        manifestPlaceholders.TERMUX_GIT_COMMIT = gitCommit

        if (appVersionName) versionName = appVersionName
        validateVersionName(versionName)
    }

    signingConfigs {
        debug {
            storeFile file('testkey_untrusted.jks')
            keyAlias 'alias'
            storePassword 'xrj45yWGLbsO7W0v'
            keyPassword 'xrj45yWGLbsO7W0v'
        }
        if (rebroadSigningEnabled) {
            rebroad {
                storeFile file(rebroadSigningStoreFile)
                storePassword rebroadSigningStorePassword
                keyAlias rebroadSigningKeyAlias
                keyPassword rebroadSigningKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (rebroadSigningEnabled) signingConfig signingConfigs.rebroad
        }

        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            outputFileName = new File("termux-boot-app_" +
                    (apkVersionTag ? apkVersionTag : "v" + versionName + "+" + variant.buildType.name) + ".apk")
        }
    }
}

dependencies {
    implementation "androidx.annotation:annotation:1.7.0"
}

task versionName {
    doLast {
        print android.defaultConfig.versionName
    }
}

def validateVersionName(String versionName) {
    // https://semver.org/spec/v2.0.0.html#is-there-a-suggested-regular-expression-regex-to-check-a-semver-string
    // ^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\+([0-9a-zA-Z-]+(?:\.[0-9a-zA-Z-]+)*))?$
    if (!java.util.regex.Pattern.matches("^(0|[1-9]\\d*)\\.(0|[1-9]\\d*)\\.(0|[1-9]\\d*)(?:-((?:0|[1-9]\\d*|\\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\\.(?:0|[1-9]\\d*|\\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\\+([0-9a-zA-Z-]+(?:\\.[0-9a-zA-Z-]+)*))?\$", versionName))
        throw new GradleException("The versionName '" + versionName + "' is not a valid version as per semantic version '2.0.0' spec in the format 'major.minor.patch(-prerelease)(+buildmetadata)'. https://semver.org/spec/v2.0.0.html.")
}
